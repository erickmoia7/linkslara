<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lara Carmen</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta property="og:title" content="Lara Carmen">
<meta property="og:image" content="https://laracarmen.com.br/foto.jpg">
<style>
  :root {
    color-scheme: dark;
    --bg: #000;
    --text: #fff;
    --muted: #9b9ba3;
    --pill: rgba(255,255,255,.09);
    --line: rgba(255,255,255,.14);
    --accent: #5b6cf0;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .fundo { position: fixed; inset: 0; z-index: 0; }
  .fundo img { width: 100%; height: 100%; object-fit: cover; filter: blur(60px) brightness(.55); transform: scale(1.3); }

  .card {
    position: relative; z-index: 1; overflow: hidden;
    width: 100%; max-width: 520px; height: 100%; max-height: 860px;
    background: #000;
  }
  @media (min-width: 560px) { .card { height: calc(100% - 40px); border-radius: 28px; } }

  .card > img.foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .card::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to bottom, transparent 45%, rgba(0,0,0,.85) 68%, #000 82%);
  }

  .info {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 0 20px calc(18px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }
  .nome { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .nome svg { width: 20px; height: 20px; flex: none; margin-top: 4px; }
  .usuario { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

  .redes { display: flex; justify-content: center; gap: 10px; margin: 14px 0 0; padding: 0; list-style: none; }
  .redes a {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none; color: #fff; transition: transform .15s;
  }
  .redes a:hover { transform: scale(1.08); }
  .redes a.tg { background: #fff; }
  .redes a.x, .redes a.tt { background: rgba(255,255,255,.08); }
  .redes a svg { width: 16px; height: 16px; }
  .redes a.tg svg { width: 100%; height: 100%; }
  .redes a:focus-visible, .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    margin: 14px 0 0; padding: 9px 16px;
    background: var(--pill); border: 1px solid var(--line); border-radius: 999px;
    color: var(--text); font: inherit; font-size: 15px; cursor: pointer;
    backdrop-filter: blur(8px);
  }
  .pill strong { font-weight: 700; }
  .pill svg { width: 14px; height: 14px; transition: transform .3s; }
  .pill.on svg { transform: rotate(180deg); }

  .bio { margin: 14px 0 0; font-size: 15px; }
  .rodape { margin: 22px 0 0; font-size: 13px; color: var(--muted); }
  .rodape a { color: var(--muted); text-decoration: none; }
  .rodape a:hover { text-decoration: underline; }

  .sheet {
    position: absolute; left: 6px; right: 6px; bottom: 6px; z-index: 5;
    max-height: 62%; padding: 0 22px 20px;
    background: linear-gradient(to bottom, rgba(34,34,38,.92), rgba(8,8,10,.97));
    backdrop-filter: blur(24px);
    border: 1px solid var(--line); border-radius: 24px 24px 22px 22px;
    transform: translateY(calc(100% + 12px));
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
    touch-action: none;
  }
  .sheet.on { transform: translateY(0); }
  .sheet.arrastando { transition: none; }
  .puxador { padding: 10px 0 12px; cursor: grab; }
  .puxador i { display: block; width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); margin: 0 auto; }
  .titulo { margin: 0 0 16px; text-align: center; font-size: 15px; font-weight: 400; }
  .titulo strong { font-weight: 700; }
  .lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
  .lista li { display: flex; align-items: center; gap: 14px; }
  .av { position: relative; width: 44px; height: 44px; flex: none; }
  .av img.pessoa { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #2a2a30; display: block; }
  .av .badge {
    position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; border-radius: 50%;
    background: #000; border: 2px solid #17171a; display: flex; align-items: center; justify-content: center;
  }
  .av .badge svg { width: 9px; height: 9px; }
  .av .badge.tg { background: #fff; border-color: #fff; }
  .av .badge.tg svg { width: 100%; height: 100%; }
  .linha .n { display: block; font-size: 15px; font-weight: 700; }
  .linha .q { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }

  @media (prefers-reduced-motion: reduce) { .sheet, .pill svg { transition: none; } }
</style>
</head>
<body>

<div class="fundo"><img id="fundo" alt=""></div>

<main class="card" id="card">
  <img class="foto" id="foto" src="foto.png" alt="laracarmen"> <!-- foto -->

  <section class="info">
    <h1 class="nome">Lara Carmen
      <svg viewBox="0 0 24 24" aria-label="Verificado"><path fill="#5b6cf0" d="M12 1.5l2.6 1.9 3.2-.1 1 3 2.6 1.9-1 3.1 1 3.1-2.6 1.9-1 3-3.2-.1L12 22.5l-2.6-1.9-3.2.1-1-3-2.6-1.9 1-3.1-1-3.1 2.6-1.9 1-3 3.2.1z"/><path d="M8 12.2l2.8 2.8 5.2-5.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </h1>
    <p class="usuario">@laracarmen0</p>

    <ul class="redes">
      <li><a href="#" class="tg" aria-label="Telegram"><svg viewBox="0 0 24 24" fill="#229ED9"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg></a></li> <!-- link -->
      <li><a href="https://www.threads.com/@laracarmen0" class="x" aria-label="Twitter / X"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a></li> <!-- link -->
      <li><a href="#" class="tt" aria-label="TikTok"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg></a></li> <!-- link -->
    </ul>

    <button class="pill" id="abrir" type="button" aria-haspopup="dialog" aria-expanded="false">
      <strong id="total">0</strong> Total Followers
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>

    <p class="bio">Hey Welcome</p>
    <p class="rodape"><a href="https://about.link.me/privacypolicy">Privacy Policy</a> | <a href="https://about.link.me/termsandconditions">Terms</a> | <a href="https://stopncii.org">Report</a></p>
  </section>

  <div class="sheet" id="sheet" role="dialog" aria-label="Seguidores por rede" aria-hidden="true">
    <div class="puxador"><i></i></div>
    <p class="titulo"><strong id="soma">0</strong> Total Followers</p>
    <ul class="lista" id="lista"></ul>
  </div>
</main>

<script>
const REDES = [
  { key: "tt", nome: "seuusuario_", seguidores: 204900, foto: "avatar-tiktok.jpg" }, // foto
  { key: "x",  nome: "seuusuario_", seguidores: 32900,  foto: "avatar-x.jpg" }, // foto
  { key: "tg", nome: "seuusuario",  seguidores: 0,      foto: "avatar-telegram.jpg" } // foto
];

const ICONES = {
  tt: document.querySelector(".redes a.tt").innerHTML,
  x:  document.querySelector(".redes a.x").innerHTML,
  tg: document.querySelector(".redes a.tg").innerHTML
};
const K = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n);
const completo = n => n.toLocaleString("pt-BR");

let total = 0;
const lista = document.getElementById("lista");
REDES.forEach(r => {
  total += r.seguidores;
  const li = document.createElement("li");
  li.className = "linha";
  li.innerHTML =
    '<span class="av"><img class="pessoa" src="' + r.foto + '" alt="">' +
    '<span class="badge ' + r.key + '">' + ICONES[r.key] + '</span></span>' +
    '<span><span class="n">' + r.nome + '</span>' +
    (r.seguidores ? '<span class="q">' + K(r.seguidores) + ' Followers</span>' : '') + '</span>';
  lista.appendChild(li);
});
document.getElementById("total").textContent = K(total);
document.getElementById("soma").textContent = completo(total);

const foto = document.getElementById("foto");
document.getElementById("fundo").src = foto.getAttribute("src");

const sheet = document.getElementById("sheet"), pill = document.getElementById("abrir");
function abrir() { sheet.classList.add("on"); pill.classList.add("on"); pill.setAttribute("aria-expanded", "true"); sheet.setAttribute("aria-hidden", "false"); }
function fechar() { sheet.classList.remove("on"); pill.classList.remove("on"); pill.setAttribute("aria-expanded", "false"); sheet.setAttribute("aria-hidden", "true"); }
pill.addEventListener("click", () => sheet.classList.contains("on") ? fechar() : abrir());
document.addEventListener("keydown", e => { if (e.key === "Escape") fechar(); });
document.getElementById("card").addEventListener("click", e => {
  if (sheet.classList.contains("on") && !sheet.contains(e.target) && !pill.contains(e.target)) fechar();
});

let y0 = null;
sheet.addEventListener("pointerdown", e => { y0 = e.clientY; sheet.classList.add("arrastando"); sheet.setPointerCapture(e.pointerId); });
sheet.addEventListener("pointermove", e => { if (y0 !== null) sheet.style.transform = "translateY(" + Math.max(0, e.clientY - y0) + "px)"; });
function soltar(e) {
  if (y0 === null) return;
  const dy = e.clientY - y0; y0 = null;
  sheet.classList.remove("arrastando"); sheet.style.transform = "";
  if (dy > 80) fechar();
}
sheet.addEventListener("pointerup", soltar);
sheet.addEventListener("pointercancel", soltar);

let ty = null;
pill.addEventListener("touchstart", e => { ty = e.touches[0].clientY; }, { passive: true });
pill.addEventListener("touchend", e => { if (ty !== null && ty - e.changedTouches[0].clientY > 30) abrir(); ty = null; });
</script>
</body>
</html>
